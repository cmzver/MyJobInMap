name: Android models drift

# Схемы сервера поменялись — Kotlin-модели Android должны быть перегенерированы
# (bash scripts/gen-android-models.sh) и закоммичены вместе с изменением.
on:
  pull_request:
    paths:
      - "server/app/**"
      - "app/src/main/java/com/fieldworker/data/remote/generated/**"
      - "scripts/gen-android-models.sh"
      - "openapitools.json"
      - ".github/workflows/ci-android-models.yml"
  push:
    branches: [main, develop]
    paths:
      - "server/app/**"
      - "app/src/main/java/com/fieldworker/data/remote/generated/**"
      - "scripts/gen-android-models.sh"
      - "openapitools.json"
      - ".github/workflows/ci-android-models.yml"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install server dependencies
        run: python -m pip install --require-hashes -r server/requirements.lock
      - name: Regenerate Android models
        run: bash scripts/gen-android-models.sh
      - name: Fail on drift
        run: |
          git add -N app/src/main/java/com/fieldworker/data/remote/generated
          if ! git diff --exit-code --stat -- app/src/main/java/com/fieldworker/data/remote/generated; then
            echo "::error::Модели Android отстают от OpenAPI сервера: bash scripts/gen-android-models.sh и закоммитьте"
            exit 1
          fi
