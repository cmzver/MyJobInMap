name: Server CI

on:
  # Новые уязвимости появляются без наших коммитов — аудит раз в неделю
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main, develop]
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci-server.yml"

jobs:
  # requirements.lock = requirements.txt, разрешённый под образ (Linux, 3.11),
  # и в нём нет пакетов с известными уязвимостями
  dependencies:
    name: Dependencies lock and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Lock matches requirements.txt
        run: |
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt --python-version 3.11             --python-platform x86_64-manylinux_2_28 --generate-hashes             --no-header --quiet -o /tmp/requirements.lock
          if ! diff -q requirements.lock /tmp/requirements.lock; then
            echo "::error::requirements.lock устарел: пересоберите (команда в шапке requirements.txt)"
            exit 1
          fi
      - name: Known vulnerabilities (pip-audit)
        run: uvx pip-audit==2.10.1 -r requirements.lock --require-hashes --disable-pip --progress-spinner off

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.lock
            server/requirements-dev.txt

      # Тестируем то же, что ставится в образ: lock с хешами, затем dev-тулзы
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Lint with Black
        run: black --check --diff app/ tests/

      - name: Check imports with isort
        run: isort --check-only --diff app/ tests/

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: server/coverage.xml

  # Тот же набор тестов против PostgreSQL — ловит диалект-несовместимости
  # перед миграцией прода с SQLite на PostgreSQL (см. docs ADR-0002).
  server-tests-postgres:
    name: Server Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fieldworker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d fieldworker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/fieldworker_test
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Build server image with PostgreSQL 15 tools
        run: docker build --tag fieldworker-server-restore .

      - name: Verify migrations and backup restore
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/fieldworker_test
        run: |
          docker run --rm --network host \
            -e TEST_DATABASE_URL \
            -e ENVIRONMENT=development \
            -e OUTBOX_ENABLED=false \
            -e PERIODIC_JOBS_ENABLED=false \
            fieldworker-server-restore python scripts/verify_backup_restore.py
