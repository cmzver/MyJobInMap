name: Android CI

on:
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/ci-android.yml"]
  push:
    branches: [main, develop]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/ci-android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Prepare Firebase configuration for compilation
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path("app/google-services.json")
          if not path.exists():
              path.write_text(json.dumps({
                  "project_info": {"project_number": "100000000000", "project_id": "fieldworker-ci"},
                  "client": [{"client_info": {"mobilesdk_app_id": "1:100000000000:android:0000000000000000", "android_client_info": {"package_name": "com.fieldworker"}}, "api_key": [{"current_key": "ci-placeholder"}]}],
                  "configuration_version": "1"
              }))
      - name: Compile, unit tests and lint
        run: bash gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --console=plain
