name: Bot CI

on:
  # Новые уязвимости появляются без наших коммитов — аудит раз в неделю
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main, develop]
    paths: ["bot/**", ".github/workflows/ci-bot.yml"]
  pull_request:
    branches: [main]
    paths: ["bot/**", ".github/workflows/ci-bot.yml"]

jobs:
  bot:
    name: Bot lock, audit and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Lock matches requirements.txt
        run: |
          uv pip compile requirements.txt --python-version 3.11 \
            --python-platform x86_64-manylinux_2_28 --generate-hashes \
            --no-header --quiet -o /tmp/requirements.lock
          if ! diff -q requirements.lock /tmp/requirements.lock; then
            echo "::error::bot/requirements.lock устарел: пересоберите (команда в шапке requirements.txt)"
            exit 1
          fi
      - name: Known vulnerabilities (pip-audit)
        run: uvx pip-audit==2.10.1 -r requirements.lock --require-hashes --disable-pip --progress-spinner off
      - name: Install and compile
        run: |
          uv venv --python 3.11 /tmp/venv
          uv pip install --python /tmp/venv/bin/python --require-hashes -r requirements.lock
          /tmp/venv/bin/python -m py_compile bot.py
