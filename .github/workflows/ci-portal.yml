name: Portal CI

on:
  push:
    branches: [main, develop]
    paths:
      - "portal/**"
      - "server/**"
      - ".github/workflows/ci-portal.yml"
  pull_request:
    branches: [main]
    paths:
      - "portal/**"
      - "server/**"
      - ".github/workflows/ci-portal.yml"

jobs:
  portal-lint:
    name: Portal Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check generated API types
        run: |
          python -m pip install -r ../server/requirements.txt
          python ../server/scripts/dump_openapi.py ../server/openapi.json
          npx openapi-typescript ../server/openapi.json -o src/types/api.generated.ts
          git diff --exit-code -- src/types/api.generated.ts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
