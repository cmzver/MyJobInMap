// Классы, которые Compose-компилятор должен считать стабильными.
// Коллекции в UI-состоянии приложения иммутабельны (копируются через copy()),
// поэтому List/Set/Map-параметры не должны ломать пропуск рекомпозиции.
kotlin.collections.*
// Время из java.time неизменяемо.
java.time.*
// Доменные модели — неизменяемые data class без var/Mutable*/массивов.
// Явно: вывод не справляется с List<ChatReaction> внутри ChatMessage.
com.fieldworker.domain.model.*
// Uri неизменяем.
android.net.Uri
